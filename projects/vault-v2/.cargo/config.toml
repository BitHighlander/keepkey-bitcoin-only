# Cargo configuration for cross-compilation

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"

# Note: SUBSYSTEM:WINDOWS is only applied to the final binary, not build scripts
# This is handled by Tauri automatically for the main application
[target.x86_64-pc-windows-msvc]
# Remove the global SUBSYSTEM:WINDOWS flag as it breaks build scripts
# Tauri will handle the subsystem for the main app

# Optional: Use LLD linker for faster builds
# [target.x86_64-pc-windows-gnu]
# linker = "rust-lld"

# Build optimizations
[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization, slower compile
strip = true        # Strip symbols
panic = "abort"     # Smaller binary