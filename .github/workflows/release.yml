name: Release KeepKey Vault v5

on:
  push:
    branches: 
      - 'release-*'
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    # Always create release first, regardless of build success
    if: startsWith(github.ref, 'refs/heads/release-') || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
      release_tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Determine release tag
        id: release-tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tag push - use the tag
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_REF}" == refs/heads/release-* ]]; then
            # Release branch - use branch name + timestamp
            BRANCH="${GITHUB_REF#refs/heads/}"
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            TAG="${BRANCH}-${TIMESTAMP}"
          else
            # Fallback
            TAG="dev-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}"
      
      - name: Create Release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          release_name: KeepKey Vault ${{ steps.release-tag.outputs.tag }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}

  build-tauri:
    needs: [create-release]
    # Continue even if some builds fail - each platform builds independently
    if: always() && needs.create-release.result == 'success'
    permissions:
      contents: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            name: 'macOS-universal'
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'Linux-AppImage'
          - platform: 'windows-latest'
            args: ''
            name: 'Windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check signing credentials
        id: check-signing
        shell: bash
        run: |
          echo "🔍 Checking for signing credentials..."
          
          # Check for Tauri signing credentials
          if [ -n "${{ secrets.TAURI_PRIVATE_KEY }}" ]; then
            echo "✅ TAURI_PRIVATE_KEY is set"
            echo "has_tauri_signing=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  TAURI_PRIVATE_KEY is NOT set - will build without Tauri signing"
            echo "has_tauri_signing=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -n "${{ secrets.TAURI_KEY_PASSWORD }}" ]; then
            echo "✅ TAURI_KEY_PASSWORD is set"
          else
            echo "⚠️  TAURI_KEY_PASSWORD is NOT set"
          fi
          
          # Check for Apple signing credentials (macOS only)
          if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            if [ -n "${{ secrets.APPLE_ID }}" ] && [ -n "${{ secrets.APPLE_ID_PASSWORD }}" ] && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
              echo "✅ Apple notarization credentials are set"
              echo "has_apple_notarization=true" >> $GITHUB_OUTPUT
            else
              echo "⚠️  Apple notarization credentials are NOT set"
              echo "has_apple_notarization=false" >> $GITHUB_OUTPUT
            fi
            
            if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ] && [ -n "${{ secrets.CERT_PW }}" ]; then
              echo "✅ Apple code signing credentials are set"
              echo "has_apple_codesigning=true" >> $GITHUB_OUTPUT
            else
              echo "⚠️  Apple code signing credentials are NOT set"
              echo "has_apple_codesigning=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_apple_notarization=false" >> $GITHUB_OUTPUT
            echo "has_apple_codesigning=false" >> $GITHUB_OUTPUT
          fi
          
          # Summary
          echo ""
          echo "🔒 Signing Summary:"
          echo "   - Tauri Signing: ${{ steps.check-signing.outputs.has_tauri_signing == 'true' && '✅ Available' || '❌ Missing' }}"
          if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            echo "   - Apple Code Signing: ${{ steps.check-signing.outputs.has_apple_codesigning == 'true' && '✅ Available' || '❌ Missing' }}"
            echo "   - Apple Notarization: ${{ steps.check-signing.outputs.has_apple_notarization == 'true' && '✅ Available' || '❌ Missing' }}"
          fi
          echo ""
          
          if [[ "${{ steps.check-signing.outputs.has_tauri_signing }}" == "false" ]]; then
            echo "⚠️  Warning: Building without signing - suitable for development only"
            echo ""
            echo "To enable signing, add these secrets to your repository:"
            echo "   - TAURI_PRIVATE_KEY: Your Tauri signing private key"
            echo "   - TAURI_KEY_PASSWORD: Password for your Tauri signing key"
            
            if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
              echo "   - APPLE_ID: Apple developer account email"
              echo "   - APPLE_ID_PASSWORD: Apple app-specific password"
              echo "   - APPLE_TEAM_ID: Apple developer team ID"
              echo "   - APPLE_CERTIFICATE: base64-encoded Apple certificate"
              echo "   - CERT_PW: Apple certificate password"
              echo "   - CODESIGN_IDENTITY: Apple code signing identity"
              echo "   - KEYCHAIN_NAME: macOS keychain name"
              echo "   - KEYCHAIN_PASSWORD: macOS keychain password"
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu/Debian)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf protobuf-compiler \
            pkg-config libusb-1.0-0-dev libudev-dev libhidapi-dev libhidapi-hidraw0 libhidapi-libusb0 libssl-dev
          
          # Verify protoc installation
          protoc --version || (echo "❌ protoc installation failed" && exit 1)
          
          # Log distribution info for debugging
          echo "📋 Distribution Info:"
          lsb_release -a || echo "lsb_release not available"
          uname -a

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          echo "Installing macOS dependencies..."
          # Install protobuf compiler
          brew install protobuf
          
          # Verify protoc installation
          protoc --version || (echo "❌ protoc installation failed" && exit 1)

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          echo "Installing Windows dependencies..."
          # Install protobuf compiler
          choco install protoc --yes
          
          # Verify protoc installation
          protoc --version
          if ($LASTEXITCODE -ne 0) {
            echo "❌ protoc installation failed"
            exit 1
          }

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        working-directory: ./projects/vault-v2
        run: bun install

      - name: Skip Mac code signing (disabled)
        if: matrix.platform == 'macos-latest'
        run: |
          echo "⚠️ Mac code signing and notarization DISABLED"
          echo "Building unsigned Mac app for development/testing only"
          echo "To enable signing, configure Apple credentials in repository secrets"

      - name: Build Tauri app
        id: build-tauri
        uses: tauri-apps/tauri-action@v0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Conditionally set Tauri signing credentials
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.check-signing.outputs.has_tauri_signing == 'true' && secrets.TAURI_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.check-signing.outputs.has_tauri_signing == 'true' && secrets.TAURI_KEY_PASSWORD || '' }}
          # Apple notarization disabled (credentials not available)
          # APPLE_ID: ${{ steps.check-signing.outputs.has_apple_notarization == 'true' && secrets.APPLE_ID || '' }}
          # APPLE_PASSWORD: ${{ steps.check-signing.outputs.has_apple_notarization == 'true' && secrets.APPLE_ID_PASSWORD || '' }}
          # APPLE_TEAM_ID: ${{ steps.check-signing.outputs.has_apple_notarization == 'true' && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: ./projects/vault-v2
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Upload artifacts (platform independent)
        uses: actions/upload-artifact@v4
        if: always() && (steps.build-tauri.outcome == 'success' || steps.build-tauri.outcome == 'failure')
        with:
          name: ${{ matrix.name }}-artifacts-${{ github.run_number }}
          path: |
            projects/vault-v2/src-tauri/target/release/bundle/
            projects/vault-v2/target/release/bundle/
          retention-days: 7
          if-no-files-found: warn

      - name: Manual upload to release (platform independent)
        if: always() && needs.create-release.result == 'success' && steps.build-tauri.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          echo "Checking for built artifacts to upload..."
          
          # Extract version from package.json
          VERSION=$(cat projects/vault-v2/package.json | grep '"version"' | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "Version: $VERSION"
          
          # Function to upload a file to the release
          upload_asset() {
            local file="$1"
            local filename=$(basename "$file")
            echo "Uploading $filename..."
            
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets?name=$filename" \
              || echo "Failed to upload $filename"
          }
          
          # Function to rename and upload DMG files (removes temporary prefix)
          upload_dmg() {
            local file="$1"
            local filename=$(basename "$file")
            # Remove temporary prefix like "rw.12345." from filename
            local clean_name=$(echo "$filename" | sed 's/^rw\.[0-9]*\.//')
            echo "Uploading $filename as $clean_name..."
            
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets?name=$clean_name" \
              || echo "Failed to upload $clean_name"
          }
          
          # Find and upload files based on platform
          case "${{ matrix.name }}" in
            "macOS-universal")
              # Check both possible DMG locations
              echo "Looking for DMG files..."
              
              # Check the expected Tauri output location first
              for file in projects/vault-v2/src-tauri/target/release/bundle/dmg/*.dmg; do
                if [ -f "$file" ]; then
                  echo "Found DMG in src-tauri path: $file"
                  upload_asset "$file"
                fi
              done
              
              # Check the alternative location (where they actually are)
              for file in projects/vault-v2/target/release/bundle/macos/*.dmg; do
                if [ -f "$file" ]; then
                  echo "Found DMG in target path: $file"
                  upload_dmg "$file"
                fi
              done
              
              # Also check for DMG files in the dmg folder
              for file in projects/vault-v2/target/release/bundle/dmg/*.dmg; do
                if [ -f "$file" ]; then
                  echo "Found DMG in target/dmg path: $file"
                  upload_dmg "$file"
                fi
              done
              
              # Upload tar.gz bundles from both possible locations
              echo "Looking for tar.gz bundles..."
              for file in projects/vault-v2/src-tauri/target/release/bundle/macos/*.app.tar.gz; do
                if [ -f "$file" ]; then
                  echo "Found tar.gz in src-tauri path: $file"
                  upload_asset "$file"
                fi
              done
              
              for file in projects/vault-v2/target/release/bundle/macos/*.app.tar.gz; do
                if [ -f "$file" ]; then
                  echo "Found tar.gz in target path: $file"
                  upload_asset "$file"
                fi
              done
              ;;
            "Windows-x64")
              echo "Looking for Windows artifacts..."
              
              # Upload NSIS installer (.exe)
              for file in projects/vault-v2/src-tauri/target/release/bundle/nsis/*.exe projects/vault-v2/target/release/bundle/nsis/*.exe; do
                if [ -f "$file" ]; then
                  echo "Found NSIS installer: $file"
                  upload_asset "$file"
                fi
              done
              
              # Upload MSI installer
              for file in projects/vault-v2/src-tauri/target/release/bundle/msi/*.msi projects/vault-v2/target/release/bundle/msi/*.msi; do
                if [ -f "$file" ]; then
                  echo "Found MSI installer: $file"
                  upload_asset "$file"
                fi
              done
              
              # Upload plain .exe (the actual executable without installer)
              if [ -f "projects/vault-v2/src-tauri/target/release/vault-v2.exe" ]; then
                echo "Found plain executable: projects/vault-v2/src-tauri/target/release/vault-v2.exe"
                # Rename it to distinguish from installer
                cp "projects/vault-v2/src-tauri/target/release/vault-v2.exe" "vault-v2_${VERSION}_x64_portable.exe"
                upload_asset "vault-v2_${VERSION}_x64_portable.exe"
                rm -f "vault-v2_${VERSION}_x64_portable.exe"
              elif [ -f "projects/vault-v2/target/release/vault-v2.exe" ]; then
                echo "Found plain executable: projects/vault-v2/target/release/vault-v2.exe"
                # Rename it to distinguish from installer
                cp "projects/vault-v2/target/release/vault-v2.exe" "vault-v2_${VERSION}_x64_portable.exe"
                upload_asset "vault-v2_${VERSION}_x64_portable.exe"
                rm -f "vault-v2_${VERSION}_x64_portable.exe"
              else
                echo "Plain .exe not found in expected locations"
              fi
              ;;
            "Linux-AppImage")
              # Check both possible locations for Linux files
              for file in projects/vault-v2/src-tauri/target/release/bundle/appimage/*.AppImage projects/vault-v2/target/release/bundle/appimage/*.AppImage; do
                [ -f "$file" ] && upload_asset "$file"
              done
              for file in projects/vault-v2/src-tauri/target/release/bundle/deb/*.deb projects/vault-v2/target/release/bundle/deb/*.deb; do
                [ -f "$file" ] && upload_asset "$file"
              done
              ;;
          esac
          
          echo "✅ Artifact upload attempt completed"

      - name: Build summary
        shell: bash
        run: |
          echo "## 📦 Build Summary - ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status**: ${{ steps.build-tauri.outcome == 'success' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tauri Signing**: ${{ steps.check-signing.outputs.has_tauri_signing == 'true' && '✅ Enabled' || '⚠️ Disabled' }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            echo "- **Apple Code Signing**: ${{ steps.check-signing.outputs.has_apple_codesigning == 'true' && '✅ Enabled' || '⚠️ Disabled' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Apple Notarization**: ${{ steps.check-signing.outputs.has_apple_notarization == 'true' && '✅ Enabled' || '⚠️ Disabled' }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.build-tauri.outcome }}" == "success" ]]; then
            echo "✅ **Build completed successfully.** Artifacts have been uploaded to the release." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build failed.** Check the logs for details." >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "${{ steps.check-signing.outputs.has_tauri_signing }}" == "false" ]]; then
            echo "⚠️ **Warning**: This build is not signed and should only be used for development/testing purposes." >> $GITHUB_STEP_SUMMARY
          fi

  update-release-notes:
    if: always() && needs.create-release.result == 'success'
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    
    steps:
      - name: Update release notes with signing status
        uses: actions/github-script@v6
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            // Get the current release to read its body
            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id
            });
            
            // Check if we have signing secrets (simplified check)
            const hasSigningSecrets = '${{ secrets.TAURI_PRIVATE_KEY }}' !== '';
            
            // Update the release body with signing status
            const signingStatus = hasSigningSecrets 
              ? '🔒 **Security**: All releases are signed and verified. Please verify signatures before installation.'
              : '⚠️ **Security Warning**: This release is NOT signed. Use at your own risk in development environments only.';
            
            const updatedBody = `## KeepKey Vault ${{ needs.create-release.outputs.release_tag }}
            
            ### Downloads
            
            - **macOS**: Universal app (\`.dmg\` and \`.app.tar.gz\`)
            - **Windows**: x64 installer (\`.exe\` and \`.msi\`)
            - **Linux**: AppImage and \`.deb\` (works on most distributions)
            
            ${signingStatus}`;
            
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              body: updatedBody
            });

  publish-release:
    if: always() && needs.create-release.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri, update-release-notes]
    
    steps:
      - name: Check build results
        run: |
          echo "## 📋 Build Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Individual Build Status:" >> $GITHUB_STEP_SUMMARY
          echo "Check the individual build jobs for platform-specific results." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.build-tauri.result }}" == "success" ]]; then
            echo "✅ **All builds completed.** Release will be published with all available artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some builds may have failed.** Release will be published with successfully built artifacts only." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "ℹ️ **Note**: Each platform builds independently. Failed platforms can be manually added to the release later." >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Publish release
        id: publish-release
        uses: actions/github-script@v6
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })
            
            console.log('✅ Release published successfully!');
            
            // Log build status
            const buildResult = '${{ needs.build-tauri.result }}';
            if (buildResult === 'success') {
              console.log('🎉 All builds completed successfully');
            } else {
              console.log('⚠️ Some builds failed - manual upload may be needed');
              console.log('Check the build summary for details');
            }
            
            // Log signing status for transparency
            const hasSigningSecrets = '${{ secrets.TAURI_PRIVATE_KEY }}' !== '';
            if (hasSigningSecrets) {
              console.log('🔒 Available builds are signed and verified');
            } else {
              console.log('⚠️ Builds are NOT signed - development build only');
            } 
